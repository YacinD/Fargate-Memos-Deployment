name: Terraform Deploy

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::956076205260:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

  health-check:
    needs: terraform
    runs-on: ubuntu-latest

    steps:
      - name: Wait for service to stabilize
        run: sleep 30

      - name: Check site health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ecsv1.online)
          echo "Received HTTP status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Health check failed — site did not return 200"
            exit 1
          fi
          echo "Health check passed — site is up"

      - name: Job summary
        run: |
          echo "### Post-deploy health check" >> $GITHUB_STEP_SUMMARY
          echo "https://ecsv1.online returned HTTP 200 ✅" >> $GITHUB_STEP_SUMMARY